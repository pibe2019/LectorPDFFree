# Memoria del daemon: KSP (Hilt + Room) y R8 necesitan mas de los 2 GB por defecto.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Build cache: reutiliza salidas de tareas entre builds y ramas.
org.gradle.caching=true
# Configuration cache: se salta la fase de configuracion si los scripts no cambiaron.
# Todo plugin nuevo debe ser compatible con ella.
org.gradle.configuration-cache=true
kotlin.code.style=official
